name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  ios:
    # Compile check only (unsigned). Signed TestFlight builds need the Apple
    # distribution certificate + provisioning profile as secrets.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Signing key from repo secrets (see README → Android signing). Without the
      # secrets the build falls back to a throwaway debug key.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      # API_BASE defaults to production (lib/config.dart); a repo variable overrides it.
      - run: flutter build apk --release ${{ vars.API_BASE && format('--dart-define=API_BASE={0}', vars.API_BASE) || '' }}
      # Must match the SHA-1 registered in Firebase (8B:39:DA:CD:…:77:CB) or phone OTP fails.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt | grep -E "DN|SHA-1|SHA-256"
          echo "::notice title=APK signing SHA-1::$(grep -m1 'SHA-1' certs.txt | awk '{print $NF}')"
      - uses: actions/upload-artifact@v4
        with:
          name: tarajuu-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # Firebase Test Lab pair: app + instrumentation APK running integration_test/app_test.dart.
      - name: Build Test Lab APKs
        working-directory: app/android
        run: |
          ./gradlew app:assembleAndroidTest
          ./gradlew app:assembleDebug -Ptarget="$(pwd)/../integration_test/app_test.dart"
      - uses: actions/upload-artifact@v4
        with:
          name: testlab-apks
          path: |
            app/build/app/outputs/apk/debug/app-debug.apk
            app/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
