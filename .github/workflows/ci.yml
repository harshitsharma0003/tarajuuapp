name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Set the repo variable API_BASE (Settings → Variables) to the VM URL,
      # e.g. https://34-93-12-7.sslip.io/api
      - run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE || 'http://10.0.2.2:8000/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: tarajuu-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
