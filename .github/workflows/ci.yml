name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  ios:
    # Always: unsigned compile check. When the four App Store secrets exist
    # (APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_API_KEY_P8, APPLE_TEAM_ID)
    # and this is a push to main, it also signs (Xcode automatic signing via the
    # App Store Connect API key — no Mac or certificates needed) and uploads to TestFlight.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: App Store secrets present?
        id: asc
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ] \
             && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=iOS TestFlight::Skipped — add the App Store secrets to enable signed uploads."
          fi
      - name: Archive, sign and upload to TestFlight
        if: steps.asc.outputs.ready == 'true'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "::notice title=iOS TestFlight::Build ${{ github.run_number }} uploaded — it appears in TestFlight after Apple's processing (~10-30 min)."

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Signing key from repo secrets (see README → Android signing). Without the
      # secrets the build falls back to a throwaway debug key.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      # API_BASE defaults to production (lib/config.dart); a repo variable overrides it.
      - run: flutter build apk --release ${{ vars.API_BASE && format('--dart-define=API_BASE={0}', vars.API_BASE) || '' }}
      # Must match the SHA-1 registered in Firebase (8B:39:DA:CD:…:77:CB) or phone OTP fails.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt | grep -E "DN|SHA-1|SHA-256"
          echo "::notice title=APK signing SHA-1::$(grep -m1 'SHA-1' certs.txt | awk '{print $NF}')"
      - uses: actions/upload-artifact@v4
        with:
          name: tarajuu-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # Firebase Test Lab pair: app + instrumentation APK running integration_test/app_test.dart.
      - name: Build Test Lab APKs
        working-directory: app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          build() {
            ./gradlew app:assembleAndroidTest
            ./gradlew app:assembleDebug -Ptarget="$(pwd)/../integration_test/app_test.dart"
          }
          if ! (set -e; build) 2>&1 | tee gradle.log; then
            # Surface the failure as an annotation (readable without opening the log).
            msg=$(grep -E 'error|What went wrong|FAILED|Exception' gradle.log | head -15 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Test Lab APK build::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: testlab-apks
          path: |
            app/build/app/outputs/apk/debug/app-debug.apk
            app/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
